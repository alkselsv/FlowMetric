tracker_type: botsort

# CCTV scenes contain small, partially occluded seated people.  These thresholds
# retain lower-confidence person detections while the motion/IoU association and
# downstream identity confidence prevent a single weak box from forcing a merge.
track_high_thresh: 0.12
track_low_thresh: 0.04
new_track_thresh: 0.10
track_buffer: 45
match_thresh: 0.8
fuse_score: true

gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
